services:
  taifex-chips:
    build: .
    image: taifex-chips
    ports:
      - "3000:3000"
    # 值由 compose 從專案目錄的 .env 帶入（只傳這兩個）；.env 不存在或沒填時為空字串，
    # 照樣啟動，但無法登入、讀寫籌碼資料與推播。
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-}
    # 平日 14:50 起每 5 分鐘自動抓資料與推播的觸發器，在同一個容器裡背景執行（見 Dockerfile 的 CMD）。
    restart: unless-stopped
